name: Trace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Compile source
        run: python -m compileall -q src scripts
      - name: Check frontend JavaScript
        run: find src -type f -name '*.js' -exec node --check {} \;
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run Trace self-test
        run: trace self-test
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Audit wheel contents and entry points
        run: python scripts/release_smoke.py audit-wheel dist/*.whl
      - name: Verify isolated wheel installation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/trace-wheel"
          "$RUNNER_TEMP/trace-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/trace-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/release_smoke.py" installed-smoke \
            --root "$RUNNER_TEMP/trace-smoke" \
            --source-root "$GITHUB_WORKSPACE"
