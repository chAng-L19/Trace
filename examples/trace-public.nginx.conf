# Included by nginx inside http {}. Trace itself stays on loopback.
map $http_origin $trace_origin_allowed {
    default 0;
    "" 1;
    ~^http://193\.112\.174\.4(:80)?$ 1;
}
map $http_origin $trace_upstream_origin {
    "" "";
    default "http://127.0.0.1:8765";
}
server {
    listen 80 default_server;
    server_name trace.example.com;
    server_tokens off;

    if ($host != "trace.example.com") { return 403; }
    if ($trace_origin_allowed = 0) { return 403; }

    auth_basic "Trace";
    auth_basic_user_file /etc/nginx/trace-public/htpasswd;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin $trace_upstream_origin;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
    }
}
