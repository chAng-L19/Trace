[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-agent"
version = "0.1.0"
description = "Trace evidence-driven durable agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Trace contributors" }]
dependencies = [
  "capstone>=5.0,<6",
  "frida>=17.0,<18",
  "playwright>=1.62,<1.63",
]

[project.scripts]
trace = "redteam_agent.cli:main"
trace-mcp = "redteam_agent.runtime.mcp_transport:main"
trace-web = "redteam_agent.adapters.web:main"
redteam-agent = "redteam_agent.cli:main"
redteam-agent-mcp = "redteam_agent.runtime.mcp_transport:main"
redteam-agent-web = "redteam_agent.adapters.web:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redteam_agent = ["workflows/*.toml", "static/*"]
