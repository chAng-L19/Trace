[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-redteam-agent"
version = "0.1.0"
description = "Host-independent durable red-team agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "codex-redteam-mode contributors" }]
dependencies = [
  "capstone>=5.0,<6",
  "frida>=17.0,<18",
  "playwright>=1.62,<1.63",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
redteam-agent = "redteam_agent.cli:main"
redteam-agent-mcp = "redteam_agent.runtime.mcp_transport:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redteam_agent = ["workflows/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
